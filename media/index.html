<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'none'; script-src {{cspSource}}; style-src {{cspSource}} 'unsafe-inline'; img-src {{cspSource}} data:; media-src {{cspSource}}; connect-src {{cspSource}}; font-src {{cspSource}};" />
  <title>PACO Scratch Editor</title>
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    #container {
      display: flex;
      height: 100%;
      flex-direction: row;
    }

    #blocklyArea {
      flex: 1;
      position: relative;
    }

    #blocklyDiv {
      position: absolute;
      inset: 0;
    }

    #javaArea {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    #javaCode {
      flex: 1;
      font-family: monospace;
      font-size: 12px;
      padding: 8px;
      border: none;
      resize: none;
    }

    #toolbar {
      padding: 4px 8px;
      background: var(--vscode-editorGroupHeader-tabsBackground, #222);
      color: var(--vscode-foreground, #fff);
      display: flex;
      gap: 8px;
      align-items: center;
      font-family: var(--vscode-font-family, sans-serif);
      font-size: 13px;
    }

    #runButton {
      background: var(--vscode-button-background, #0e639c);
      color: var(--vscode-button-foreground, #fff);
      border: none;
      padding: 3px 10px;
      cursor: pointer;
      font: inherit;
    }

    #runButton:hover {
      background: var(--vscode-button-hoverBackground, #1177bb);
    }

    /* La webview hereda el color de texto del tema de VS Code; en temas oscuros
       las categorías quedaban gris claro sobre el fondo gris claro de Blockly */
    .blocklyToolboxCategoryLabel,
    .blocklyTreeLabel {
      color: #1e1e1e;
    }

    #errorBanner {
      display: none;
      padding: 4px 8px;
      background: var(--vscode-inputValidation-errorBackground, #5a1d1d);
      color: var(--vscode-foreground, #fff);
      border-bottom: 1px solid var(--vscode-inputValidation-errorBorder, #be1100);
      font-family: var(--vscode-font-family, sans-serif);
      font-size: 12px;
    }
  </style>

  <!-- Blockly incluido en la extensión (media/blockly), con los textos en español -->
  <script src="{{root}}/blockly/blockly.min.js"></script>
  <script src="{{root}}/blockly/blocks_compressed.js"></script>
  <script src="{{root}}/blockly/msg/es.js"></script>
  <script src="{{root}}/index.js"></script>


</head>

<body data-root="{{root}}">
  <div style="display:flex; height:100%; flex-direction:column;">
    <div id="toolbar">
      <span style="font-weight:bold;">PACO</span>
      <button id="runButton" title="Compila y ejecuta el Java generado en un terminal">&#9654; Ejecutar</button>
    </div>
    <div id="errorBanner" role="alert"></div>
    <div id="blocklyArea" style="flex:1; position:relative;">
      <div id="blocklyDiv" style="position:absolute; inset:0;"></div>
    </div>
  </div>
</body>

</html>
